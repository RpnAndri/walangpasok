<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Walang Pasok</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100%;
            background: #000;

            transition:
                filter 0.2s ease,
                opacity 0.2s ease;
        }

        #map.loading {
            filter: blur(6px);
            opacity: 0.65;
        }

        /* =========================================
           DATE CONTROLS
           ========================================= */

        #controls {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);

            z-index: 1000;

            display: flex;
            flex-direction: column;
            align-items: center;

            gap: 8px;

            font-family: Arial, sans-serif;
        }

        #date-search {
            display: flex;
            gap: 8px;
        }

        #date {
            padding: 10px 12px;

            border: none;
            border-radius: 8px;

            background: white;
            color: black;

            font-size: 14px;

            outline: none;
        }

        #search-button {
            padding: 10px 16px;

            border: none;
            border-radius: 8px;

            background: white;
            color: black;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;
        }

        #search-button:hover {
            background: #e5e5e5;
        }

        #display-date {
            color: white;

            font-size: 20px;
            font-weight: 600;

            text-shadow:
                0 1px 4px rgba(0, 0, 0, 0.8);
        }

        /* =========================================
           LOADING
           ========================================= */

        #loading {
            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            z-index: 2000;

            width: 42px;
            height: 42px;

            border: 4px solid rgba(255, 255, 255, 0.25);
            border-top-color: white;

            border-radius: 50%;

            animation: spin 0.8s linear infinite;

            display: none;
        }

        @keyframes spin {
            to {
                transform:
                    translate(-50%, -50%)
                    rotate(360deg);
            }
        }
    </style>
</head>

<body>

<div id="map"></div>

<div id="controls">

    <div id="date-search">

        <input
            type="date"
            id="date"
        >

        <button
            id="search-button"
            type="button"
        >
            Search
        </button>

    </div>
    <div id="display-date">
    </div>

</div>

<div id="loading">
</div>


<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<script>

    // =========================================
    // MAP
    // =========================================

    const map = L.map("map", {
        zoomControl: false,
        attributionControl: false,
        minZoom: 10,
    });


    // =========================================
    // ELEMENTS
    // =========================================

    const dateInput =
        document.getElementById("date");

    const searchButton =
        document.getElementById(
            "search-button"
        );

    const displayDate =
        document.getElementById(
            "display-date"
        );

    const loading =
        document.getElementById(
            "loading"
        );

    const mapElement =
        document.getElementById("map");


    // =========================================
    // HELPERS
    // =========================================

    function normalizeLocation(name) {

        return name
            .toLowerCase()
            .trim()
            .replace(
                /^city of\s+/i,
                ""
            )
            .replace(
                /\s+city$/i,
                ""
            )
            .replace(
                /\s+/g,
                " "
            );
    }


    function formatDate(date) {

        const parts =
            date.split("-");

        if (parts.length !== 3) {
            return date;
        }

        const year =
            Number(parts[0]);

        const month =
            Number(parts[1]);

        const day =
            Number(parts[2]);

        const parsed =
            new Date(
                year,
                month - 1,
                day
            );

        return parsed.toLocaleDateString(
            "en-US",
            {
                month: "long",
                day: "numeric",
                year: "numeric",
            }
        );
    }


    // =========================================
    // GLOBAL GEOJSON
    // =========================================

    let geojsonData = null;
    let ncrLayer = null;


    // =========================================
    // LOAD SUSPENSIONS
    // =========================================

    async function loadSuspensions(
        date
    ) {

        loading.style.display =
            "block";

        mapElement.classList.add(
            "loading"
        );

        searchButton.disabled = true;

        try {

            const response =
                await fetch(
                    `/api/suspensions?date_=${date}`
                );

            if (!response.ok) {
                throw new Error(
                    `HTTP ${response.status}`
                );
            }

            const data =
                await response.json();

            console.log(
                "Suspension data:",
                data
            );

            updateMap(
                data.municipalities || {}
            );

            displayDate.textContent =
                formatDate(date);

        } catch (error) {

            console.error(
                "Failed to load suspensions:",
                error
            );

            displayDate.textContent =
                "Failed to load data";

        } finally {

            loading.style.display =
                "none";

            mapElement.classList.remove(
                "loading"
            );

            searchButton.disabled =
                false;
        }
    }


    // =========================================
    // UPDATE MAP
    // =========================================

    function updateMap(
        municipalities
    ) {

        const suspensionLookup = {};


        // -----------------------------------------
        // Flatten backend response
        // -----------------------------------------

        for (
            const province
            in municipalities
        ) {

            const locations =
                municipalities[
                    province
                ];

            for (
                const location
                of locations
            ) {

                suspensionLookup[
                    normalizeLocation(
                        location
                    )
                ] = true;
            }
        }


        // -----------------------------------------
        // Update each NCR polygon
        // -----------------------------------------

        ncrLayer.eachLayer(
            layer => {

                const name =
                    layer.feature
                        ?.properties
                        ?.name || "";

                const normalized =
                    normalizeLocation(
                        name
                    );

                const suspended =
                    suspensionLookup[
                        normalized
                    ] === true;


                layer.setStyle({

                    color: "#000000",

                    weight: 1,

                    fillColor:
                        suspended
                            ? "#ef4444"
                            : "#22c55e",

                    fillOpacity: 1,
                });


                // Update tooltip

                layer.bindTooltip(
                    `
                    <strong>
                        ${name}
                    </strong>
                    <br>
                    ${
                        suspended
                            ? "Walang Pasok"
                            : "May Pasok"
                    }
                    `,
                    {
                        sticky: true,
                    }
                );
            }
        );
    }


    // =========================================
    // SEARCH BUTTON
    // =========================================

    searchButton.addEventListener(
        "click",
        () => {

            const date =
                dateInput.value;

            if (!date) {
                return;
            }

            loadSuspensions(
                date
            );
        }
    );


    // Allow pressing Enter

    dateInput.addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter"
            ) {

                searchButton.click();
            }
        }
    );


    // =========================================
    // LOAD NCR GEOJSON
    // =========================================

    fetch(
        "/data/ncr.geojson"
    )

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    `Failed to load GeoJSON: ${response.status}`
                );
            }

            return response.json();
        })

        .then(geojson => {

            geojsonData =
                geojson;


            // -----------------------------------------
            // Create map layer
            // -----------------------------------------

            ncrLayer =
                L.geoJSON(
                    geojsonData,
                    {

                        style: {

                            color: "#000000",

                            weight: 1,

                            fillColor:
                                "#22c55e",

                            fillOpacity: 1,
                        },


                        onEachFeature:
                            function(
                                feature,
                                layer
                            ) {

                                const name =
                                    feature
                                        .properties
                                        ?.name ||
                                    "Unknown";

                                layer.bindTooltip(
                                    name,
                                    {
                                        sticky: true,
                                    }
                                );
                            }
                    }
                )
                .addTo(map);


            // -----------------------------------------
            // Center on NCR
            // -----------------------------------------

            const bounds =
                ncrLayer.getBounds();

            map.fitBounds(
                bounds,
                {
                    padding: [20, 20],
                }
            );


            // -----------------------------------------
            // Prevent leaving NCR
            // -----------------------------------------

            map.setMaxBounds(
                bounds.pad(0.05)
            );

            map.options.maxBoundsViscosity =
                1.0;


            // -----------------------------------------
            // Default date
            // -----------------------------------------

            const today =
                new Date();

            const year =
                today.getFullYear();

            const month =
                String(
                    today.getMonth() + 1
                ).padStart(2, "0");

            const day =
                String(
                    today.getDate()
                ).padStart(2, "0");

            const todayString =
                `${year}-${month}-${day}`;

            dateInput.value =
                todayString;


            // -----------------------------------------
            // Load today's suspensions
            // -----------------------------------------

            loadSuspensions(
                todayString
            );

        })

        .catch(error => {

            console.error(
                "Failed to initialize map:",
                error
            );

            displayDate.textContent =
                "Failed to load map";
        });

</script>

</body>
</html>
